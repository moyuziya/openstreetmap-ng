name: Run tests

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit for patch or baseline comparison
        required: true
        type: choice
        default: 9310e60f49b21c378610fbbe86f5a66b27bb011e
        options:
          - 9310e60f49b21c378610fbbe86f5a66b27bb011e
          - 0f27e65e07355d81974b5154d7a982316c1b1363

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.implementation }} tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        implementation: [python, cython]
        exclude:
          - os: macos-latest
            implementation: cython
      fail-fast: false

    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build Cython modules
        if: matrix.implementation == 'cython'
        run: |
          nix-shell --pure --run "cython-build-fast"

      - name: Start services
        run: |
          nix-shell --pure --run "dev-start"

      - name: Run tests
        run: |
          nix-shell --pure --run "run-tests --extended --term"
